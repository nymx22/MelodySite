<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mobile Preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #1a1a1a;
        font-family: system-ui, -apple-system, sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 48px;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 1.25rem;
        font-weight: 500;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 24px;
      }
      .controls a {
        padding: 8px 16px;
        background: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.875rem;
      }
      .controls a:hover, .controls a.active {
        background: #555;
      }
      .phone-frame {
        width: 375px;
        height: 667px;
        background: #111;
        border-radius: 40px;
        padding: 12px;
        box-shadow:
          0 0 0 3px #333,
          0 0 0 6px #222,
          0 25px 50px -12px rgba(0,0,0,0.5),
          inset 0 0 6px rgba(255,255,255,0.05);
      }
      .phone-screen {
        width: 100%;
        height: 100%;
        background: #fff;
        border-radius: 28px;
        overflow: hidden;
      }
      .phone-screen iframe {
        width: 375px;
        height: 100%;
        border: none;
        transform-origin: 0 0;
      }
      @media (max-width: 420px) {
        .phone-frame {
          width: 100%;
          max-width: 375px;
          height: 70vh;
          min-height: 500px;
        }
        .phone-screen iframe {
          width: 100%;
          min-width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Mobile preview</h1>
    <div class="controls">
      <a href="#" data-src="home.html" class="active">Home</a>
      <a href="#" data-src="index.html">Work</a>
      <a href="#" data-src="about.html">About</a>
      <a href="#" data-src="always-aching-sometimes-mending.html">AASM</a>
      <a href="#" data-src="nightmares.html">Nightmares</a>
      <a href="#" data-src="aasm-gallery.html">Gallery</a>
      <a href="#" data-src="contact.html">Contact</a>
    </div>
    <div class="phone-frame">
      <div class="phone-screen">
        <iframe id="preview" src="home.html" title="Mobile preview"></iframe>
      </div>
    </div>
    <script>
      const iframe = document.getElementById("preview");
      document.querySelectorAll(".controls a").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          iframe.src = a.dataset.src;
          document.querySelectorAll(".controls a").forEach((b) => b.classList.remove("active"));
          a.classList.add("active");
        });
      });
    </script>
  </body>
</html>
