<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mobile Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #1a1a1a;
        font-family: Arial, sans-serif;
        color: #fff;
        padding: 24px 16px 48px;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 1.25rem;
        font-weight: 500;
      }
      .page-controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 20px;
      }
      .page-controls a {
        padding: 8px 16px;
        background: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.875rem;
        cursor: pointer;
      }
      .page-controls a:hover,
      .page-controls a.active {
        background: #555;
      }
      .mobile-frame {
        width: 375px;
        height: 667px;
        border: 8px solid #333;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        background: #000;
        position: relative;
      }
      .mobile-frame::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 4px;
        background: #333;
        border-radius: 0 0 4px 4px;
        z-index: 10000;
      }
      .mobile-frame iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
      .controls {
        margin-top: 20px;
        text-align: center;
      }
      .controls button {
        margin: 5px;
        padding: 10px 20px;
        background: #4a90c4;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }
      .controls button:hover {
        background: #357abd;
      }
      .size-label {
        margin-top: 10px;
        color: #888;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Mobile preview</h1>
    <div class="page-controls">
      <a href="#" data-src="home/" class="active">Home</a>
      <a href="#" data-src="index.html">Work</a>
      <a href="#" data-src="about/">About</a>
      <a href="#" data-src="always-aching-sometimes-mending/">AASM</a>
      <a href="#" data-src="nightmares/">Nightmares</a>
      <a href="#" data-src="a-happy-family/">A Happy Family</a>
      <a href="#" data-src="aasm-gallery/">Gallery</a>
      <a href="#" data-src="contact/">Contact</a>
    </div>
    <div class="mobile-frame">
      <iframe id="preview" src="home/" title="Mobile preview"></iframe>
    </div>
    <div class="controls">
      <button onclick="reload()">Reload</button>
      <button onclick="toggleSize()">Toggle Size</button>
      <div class="size-label" id="sizeLabel">iPhone SE (375×667)</div>
    </div>
    <script>
      const iframe = document.getElementById("preview");
      const frame = document.querySelector(".mobile-frame");
      const sizeLabel = document.getElementById("sizeLabel");
      let isSmall = false;

      document.querySelectorAll(".page-controls a").forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          iframe.src = a.dataset.src;
          document
            .querySelectorAll(".page-controls a")
            .forEach((b) => b.classList.remove("active"));
          a.classList.add("active");
        });
      });

      function reload() {
        iframe.src = iframe.src;
      }

      function toggleSize() {
        if (isSmall) {
          frame.style.width = "375px";
          frame.style.height = "667px";
          sizeLabel.textContent = "iPhone SE (375×667)";
          isSmall = false;
        } else {
          frame.style.width = "320px";
          frame.style.height = "568px";
          sizeLabel.textContent = "iPhone SE small (320×568)";
          isSmall = true;
        }
      }
    </script>
  </body>
</html>
